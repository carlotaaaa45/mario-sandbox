<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario Sandbox Interactivo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #5c94fc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 450px;
            background-color: #5c94fc;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            display: block;
            background-color: #5c94fc;
        }
        /* Ventana emergente (Modal) */
        #modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .modal-card {
            background: #fff;
            border: 4px solid #e52521;
            border-radius: 12px;
            padding: 20px;
            width: 85%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            animation: popIn 0.3s ease;
        }
        @keyframes popIn {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-title {
            color: #e52521;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .modal-question {
            color: #333;
            font-size: 15px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }
        .option-btn {
            background: #fcd116;
            border: 2px solid #d8a000;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        .option-btn:hover {
            background: #ffea79;
            transform: translateY(-2px);
        }
        .feedback-text {
            font-weight: bold;
            font-size: 14px;
            min-height: 20px;
            margin-bottom: 10px;
        }
        .close-btn {
            background: #e52521;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
        }
        .close-btn:hover {
            background: #b81916;
        }
        #instruction {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.5);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="instruction">Mueve a Mario con las Flechas y Salta con ESPACIO</div>
    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <div id="modal-overlay">
        <div class="modal-card">
            <div class="modal-title" id="modal-title">¡Bloque Interactuado!</div>
            <div class="modal-question" id="modal-question">Pregunta aquí...</div>
            <div class="options-container" id="options-container"></div>
            <div class="feedback-text" id="feedback"></div>
            <button class="close-btn" id="close-btn" onclick="closeModal()">Continuar Jugando</button>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let gamePaused = false;

const mario = {
    x: 100,
    y: 300,
    width: 32,
    height: 40,
    vx: 0,
    vy: 0,
    speed: 4,
    jumpPower: -10.5,
    gravity: 0.5,
    grounded: false,
    color: '#e52521'
};

const keys = { right: false, left: false, up: false };

const questionsData = {
    1: {
        question: "¿Cuál es el objeto central de estudio de la Didáctica?",
        options: [
            "A) Los procesos de enseñanza y aprendizaje",
            "B) La infraestructura física escolar",
            "C) La administración presupuestaria"
        ],
        correct: 0
    },
    2: {
        question: "¿En qué consiste el modelo conductista de B.F. Skinner?",
        options: [
            "A) Aprendizaje espontáneo e intuitivo",
            "B) Relación entre estímulo, respuesta y refuerzo",
            "C) Memorización clásica de textos universales"
        ],
        correct: 1
    },
    3: {
        question: "¿Qué define a una buena Planeación Didáctica?",
        options: [
            "A) Un trámite rígido que no se modifica",
            "B) Una guía flexible y adaptable al contexto del aula",
            "C) Una lista de sanciones escolares"
        ],
        correct: 1
    }
};

const questionBlocks = [
    { id: 1, x: 220, y: 240, width: 36, height: 36, hit: false, color: '#fcd116' },
    { id: 2, x: 380, y: 200, width: 36, height: 36, hit: false, color: '#fcd116' },
    { id: 3, x: 540, y: 240, width: 36, height: 36, hit: false, color: '#fcd116' }
];

const groundY = 380;

window.addEventListener('keydown', (e) => {
    if (gamePaused) return;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
    if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w' || e.key === 'W') {
        if (mario.grounded) {
            mario.vy = mario.jumpPower;
            mario.grounded = false;
        }
    }
});

window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
});

function update() {
    if (gamePaused) return;

    if (keys.right) mario.vx = mario.speed;
    else if (keys.left) mario.vx = -mario.speed;
    else mario.vx = 0;

    mario.vy += mario.gravity;
    mario.x += mario.vx;
    mario.y += mario.vy;

    if (mario.x < 0) mario.x = 0;
    if (mario.x + mario.width > canvas.width) mario.x = canvas.width - mario.width;

    if (mario.y + mario.height >= groundY) {
        mario.y = groundY - mario.height;
        mario.vy = 0;
        mario.grounded = true;
    }

    questionBlocks.forEach(block => {
        if (
            mario.x < block.x + block.width &&
            mario.x + mario.width > block.x &&
            mario.y < block.y + block.height &&
            mario.y + mario.height > block.y
        ) {
            if (mario.vy < 0 && mario.y + mario.height > block.y + block.height - 12) {
                mario.vy = 2;
                if (!block.hit) {
                    triggerQuestion(block);
                }
            } else if (mario.vy > 0 && mario.y + mario.height - mario.vy <= block.y) {
                mario.y = block.y - mario.height;
                mario.vy = 0;
                mario.grounded = true;
            }
        }
    });
}

function triggerQuestion(block) {
    gamePaused = true;
    const qData = questionsData[block.id];
    
    document.getElementById('modal-title').innerText = `¡Pregunta del Bloque ${block.id}!`;
    document.getElementById('modal-question').innerText = qData.question;
    
    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';
    document.getElementById('feedback').innerText = '';

    qData.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(idx, qData.correct, block);
        optionsContainer.appendChild(btn);
    });

    document.getElementById('modal-overlay').style.display = 'flex';
}

function checkAnswer(selected, correct, block) {
    const feedback = document.getElementById('feedback');
    if (selected === correct) {
        feedback.style.color = '#008000';
        feedback.innerText = '¡Correcto! Excelente respuesta.';
        block.hit = true;
        block.color = '#888888';
    } else {
        feedback.style.color = '#e52521';
        feedback.innerText = 'Incorrecto. ¡Inténtalo de nuevo!';
    }
}

function closeModal() {
    document.getElementById('modal-overlay').style.display = 'none';
    gamePaused = false;
    requestAnimationFrame(gameLoop);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#5c94fc';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#c84c0c';
    ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
    ctx.fillStyle = '#00a800';
    ctx.fillRect(0, groundY, canvas.width, 10);

    questionBlocks.forEach(block => {
        ctx.fillStyle = block.color;
        ctx.fillRect(block.x, block.y, block.width, block.height);
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.strokeRect(block.x, block.y, block.width, block.height);

        ctx.fillStyle = '#000';
        ctx.font = 'bold 20px Courier New';
        ctx.fillText(block.hit ? '✓' : '?', block.x + 11, block.y + 25);
    });

    ctx.fillStyle = mario.color;
    ctx.fillRect(mario.x, mario.y, mario.width, mario.height);
    
    ctx.fillStyle = '#000';
    ctx.fillRect(mario.x + 20, mario.y + 8, 6, 6);
    ctx.fillStyle = '#fcd116';
    ctx.fillRect(mario.x + 4, mario.y + 20, 24, 6);
}

function gameLoop() {
    update();
    draw();
    if (!gamePaused) {
        requestAnimationFrame(gameLoop);
    }
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
